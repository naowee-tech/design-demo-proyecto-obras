<!doctype html>
<html lang="es" data-theme="territorio">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto de Obras · Presupuesto · Consulta de precios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../shared/proyecto-ns.js"></script>
<link rel="stylesheet" href="../shared/design-system.css">
<link rel="stylesheet" href="../shared/theme-territorio.css">
<link rel="stylesheet" href="../shared/glass-theme.css">
<link rel="stylesheet" href="../shared/territorio-shell.css?v=0.7.0">
<link rel="stylesheet" href="../shared/theme.css?v=0.7.0">
<link rel="stylesheet" href="../shared/rediseno.css?v=0.7.0">
<style>
  .cq-search{ position:relative; }
  .cq-search .naowee-searchbox__input-wrap{ height:52px; border-radius:14px; }
  .cq-search input{ font-size:15px; }
  .cq-res{ position:absolute; z-index:30; top:calc(100% + 6px); left:0; right:0; background:#fff; border:1px solid var(--rd-line); border-radius:14px; box-shadow:0 18px 40px -18px rgba(16,30,50,.35); padding:6px; max-height:360px; overflow:auto; }
  .cq-res button{ width:100%; display:flex; gap:10px; align-items:center; padding:9px 10px; border:0; background:none; border-radius:10px; text-align:left; font-family:inherit; font-size:13px; cursor:pointer; color:var(--rd-ink); }
  .cq-res button:hover, .cq-res button:focus{ background:var(--rd-soft); outline:none; }
  .cq-res .k{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--rd-muted); padding:8px 10px 2px; }
  .rd-tree-apu .rd-pr{ font-size:12px; font-weight:700; color:var(--rd-muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .rd-tree-apu.sel .rd-pr{ color:var(--rd-brand-ink); }
</style>
</head>
<body data-role="USUARIO">

<div class="t-shell">
  <aside class="t-side" id="tSide"></aside>
  <div class="t-side-overlay" id="sideOverlay"></div>

  <div class="t-main">
    <header class="t-topbar">
      <button class="t-hamburger" id="hamburger" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="t-topbar-left">
        <div class="t-bc"><a href="../index.html" style="color:inherit;text-decoration:none">Proyecto de Obras</a><span class="sep">/</span><span>Presupuesto</span><span class="sep">/</span><b>Consulta de precios</b></div>
        <h1>Consulta de precios</h1>
      </div>
      <div class="t-topbar-right">
        <button class="t-userchip" aria-label="Perfil" onclick="togglePanel()"><span class="ava" id="ucAva">MR</span><span id="ucWho">Marta Ríos<small>Usuario autorizado</small></span><svg class="cv" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </header>
    <main class="t-board" id="cqMain"></main>
  </div>
</div>

<script src="../shared/data-catalogo.js?v=0.7.0"></script>
<script src="../shared/ui.js?v=0.7.0"></script>
<script src="../shared/shell.js?v=0.7.0"></script>
<script src="../shared/rd.js?v=0.7.0"></script>
<script>
/* ============================================================================
 * Consulta de precios (docs/rediseno V6 · HU17, HU18) — Usuario autorizado.
 * Primero qué rige (catálogo para tu rol, versión vigente y desde cuándo) y después
 * encontrar un precio. Solo lee la versión VIGENTE: lo que se edita en la versión en
 * preparación no se filtra aquí. El alcance del catálogo se cruza con el rol del perfil;
 * el Admin (bypass en el backend) ve todos los activos.
 * ========================================================================== */
(function () {
  'use strict';
  var D = window.OBRAS, U = window.OBRAS_UI, R = window.RD, esc = R.esc, ic = R.ic;
  var SH = window.OBRAS_SHELL || { role: 'USUARIO', roleData: { alcance: 'Gestor de presupuesto' } };
  var rolAlc = SH.roleData.alcance;
  var S = { cat: R.qs('cat'), depto: R.qs('dep'), sel: R.qs('apu'), abiertos: {}, cerrados: {}, q: '', filtro: '' };

  function cats() { return D.catalogosParaRol(rolAlc); }
  function uso() {
    // En cuántos APU de la versión aparece cada insumo (para "insumo compartido").
    var m = {}, v = vig(); if (!v) return m;
    var p = v.contenido.precios[S.depto] || {};
    Object.keys(p).forEach(function (a) { p[a].det.forEach(function (d) { m[d.ins] = (m[d.ins] || 0) + 1; }); });
    return m;
  }
  function cat() { return D.getCatalogo(S.cat); }
  function vig() { var c = cat(); return c ? D.vigente(c) : null; }

  function render() {
    var lista = cats(), el = document.getElementById('cqMain');
    if (!lista.length) {
      el.innerHTML = '<div class="rd-card rd-empty" id="cqVacio"><b>No hay catálogos vigentes para tu rol</b>Tu perfil es <b>' + esc(rolAlc || '—') + '</b>. Un catálogo aparece aquí cuando su alcance incluye tu rol y tiene una versión activa. Pídele al administrador que lo revise.</div>';
      return;
    }
    if (!S.cat || !lista.some(function (c) { return c.id === S.cat; })) S.cat = lista[0].id;
    var c = cat(), v = D.vigente(c), cargados = D.deptosCargados(v);
    if (!S.depto || cargados.indexOf(S.depto) < 0) S.depto = cargados[0];
    var h = '<div class="rd-card" id="cqContexto"><div class="rd-row"><div class="rd-grow"><div class="rd-row">' + R.chip('Solo lectura', 'neutral') + R.chip(v.v + ' vigente', 'ok') + '</div>' +
      (lista.length > 1 ? '<label class="sr-only" for="cqCat">Catálogo</label><select id="cqCat" class="rd-select" style="margin-top:10px;max-width:520px;font-weight:800;font-size:16px">' + lista.map(function (x) { return '<option value="' + x.id + '"' + (x.id === c.id ? ' selected' : '') + '>' + esc(x.nombre) + '</option>'; }).join('') + '</select>'
        : '<h2 class="rd-ws-title" style="margin-top:8px">' + esc(c.nombre) + '</h2>') +
      '<p class="rd-sub" style="margin-top:6px">' + esc(v.v) + ' · vigente desde el ' + D.fmtFecha(v.activada) + ' · ' + (rolAlc ? 'para tu rol: <b>' + esc(rolAlc) + '</b>' : 'Admin: ves todos los catálogos activos') + (lista.length > 1 ? ' · ' + lista.length + ' catálogos disponibles' : '') + '</p></div></div>' +
      '<div class="cq-search" style="margin-top:14px"><div class="naowee-searchbox"><div class="naowee-searchbox__input-wrap"><span class="naowee-searchbox__icon">' + ic('search', 18) + '</span><input class="naowee-searchbox__input" id="itemSearch" placeholder="Buscar un APU o insumo por código o nombre" aria-label="Buscar un APU o insumo" autocomplete="off" aria-controls="cqRes" aria-expanded="false"></div></div><div class="cq-res" id="cqRes" hidden role="listbox" aria-label="Resultados"></div></div></div>';
    // Sin APU elegido, los capítulos se ven a todo lo ancho y expandidos; al elegir uno, la
    // tabla se contrae a árbol y entra el detalle (en vez de un detalle vacío al lado).
    var a = S.sel && D.apu(v, S.sel);
    if (!a || a.activo === false || !D.precio(v, S.depto, a.id)) { S.sel = null; h += tabla(c, v, cargados); }
    else h += '<div class="rd-split" style="margin-top:14px">' + arbol(c, v, cargados) + '<div id="cqDetalle">' + detalle(c, v) + '</div></div>';
    el.innerHTML = h;
    wire(c, v);
  }

  function arbol(c, v, cargados) {
    var q = U.norm(S.filtro);
    var t = '<div class="rd-tree" id="catTree" data-modo="arbol"><div class="rd-tree-head"><label class="naowee-textfield__label" for="cqDepto" style="margin:0">Departamento</label>' +
      '<select id="cqDepto" class="rd-select">' + cargados.map(function (d) { return '<option' + (d === S.depto ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join('') + '</select>' +
      '<span class="rd-sub">' + cargados.length + ' de ' + c.alcance.deptos.length + ' departamentos con precios · ' + v.contenido.capitulos.length + ' capítulos · ' + D.nApus(v) + ' APU</span>' +
      '<div class="rd-row"><button class="naowee-btn naowee-btn--mute naowee-btn--small" id="btnAbrirTodo">Expandir todo</button><button class="naowee-btn naowee-btn--mute naowee-btn--small" id="btnCerrarTodo">Contraer todo</button></div></div>' +
      '<div class="rd-tree-body" role="tree" aria-label="Capítulos y APU">';
    v.contenido.capitulos.slice().sort(function (a, b) { return D.capitulo(a.id).orden - D.capitulo(b.id).orden; }).forEach(function (cp) {
      var g = D.capitulo(cp.id), apus = D.apusDeCapitulo(v, cp.id).filter(function (a) { return a.activo !== false && D.precio(v, S.depto, a.id); });
      if (!apus.length) return;
      var sel = apus.some(function (a) { return a.id === S.sel; }), open = S.abiertos[cp.id] || sel;
      t += '<div role="treeitem" aria-expanded="' + !!open + '" data-nivel="' + cp.id + '"><button class="rd-tree-cap" data-cap="' + cp.id + '" aria-expanded="' + !!open + '"><svg class="rd-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg><span>' + esc(g.cod) + ' · ' + esc(g.nombre) + '</span><span class="rd-tree-n">' + apus.length + ' APU</span></button>' +
        '<div class="rd-tree-apus" role="group"' + (open ? '' : ' hidden') + '>' + apus.map(function (a) {
          var p = D.precio(v, S.depto, a.id);
          return '<button class="rd-tree-apu' + (a.id === S.sel ? ' sel' : '') + '" data-apu="' + a.id + '" role="treeitem" aria-selected="' + (a.id === S.sel) + '"><span class="rd-cod">' + esc(a.cod) + '</span><span class="rd-nm">' + esc(a.nombre) + '</span><span class="rd-pr">' + D.fmtCOP(p.valor) + ' /' + esc(a.unidad) + '</span></button>';
        }).join('') + '</div></div>';
    });
    return t + '</div></div>';
  }

  function tabla(c, v, cargados) {
    var p = v.contenido.precios[S.depto] || {};
    var t = '<div class="rd-card" id="catTree" data-modo="tabla" style="margin-top:14px"><div class="rd-row"><div style="min-width:240px"><label class="naowee-textfield__label" for="cqDepto" style="margin:0 0 6px;display:block">Departamento</label>' +
      '<select id="cqDepto" class="rd-select">' + cargados.map(function (d) { return '<option' + (d === S.depto ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join('') + '</select></div>' +
      '<span class="rd-sub rd-grow" style="align-self:flex-end">' + cargados.length + ' de ' + c.alcance.deptos.length + ' departamentos con precios · ' + v.contenido.capitulos.length + ' capítulos · ' + D.nApus(v) + ' APU · elige un APU para ver su composición</span>' +
      '<div class="rd-row" style="align-self:flex-end"><button class="naowee-btn naowee-btn--mute naowee-btn--small" id="btnAbrirTodo">Expandir todo</button><button class="naowee-btn naowee-btn--mute naowee-btn--small" id="btnCerrarTodo">Contraer todo</button></div></div>' +
      '<div class="rd-tbl-wrap" style="margin-top:12px"><table class="rd-tbl" aria-label="Capítulos y APU en ' + esc(S.depto) + '"><thead><tr><th>Código</th><th>APU</th><th>Unidad</th><th class="r">Valor en ' + esc(S.depto) + '</th><th>Control</th></tr></thead>';
    v.contenido.capitulos.slice().sort(function (a, b) { return D.capitulo(a.id).orden - D.capitulo(b.id).orden; }).forEach(function (cp) {
      var g = D.capitulo(cp.id), apus = D.apusDeCapitulo(v, cp.id).filter(function (a) { return a.activo !== false && p[a.id]; });
      if (!apus.length) return;
      var open = !S.cerrados[cp.id];
      t += '<tbody data-nivel="' + cp.id + '"><tr><td colspan="5" style="background:var(--rd-soft);padding:0"><button class="rd-tree-cap" data-cap="' + cp.id + '" aria-expanded="' + open + '" style="border-radius:0;padding:11px 12px"><svg class="rd-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg><span>' + esc(g.cod) + ' · ' + esc(g.nombre) + '</span><span class="rd-tree-n">' + apus.length + ' APU</span></button></td></tr>' +
        (open ? apus.map(function (a) {
          var pr = p[a.id], ctl = D.control(pr);
          return '<tr class="rd-click" data-apu="' + a.id + '" tabindex="0"><td><b>' + esc(a.cod) + '</b></td><td>' + esc(a.nombre) + '</td><td>' + esc(a.unidad) + '</td><td class="r"><b>' + D.fmtCOP(pr.valor) + '</b> <span class="rd-muted">/' + esc(a.unidad) + '</span></td><td>' +
            (ctl.ok ? '<span class="rd-muted" style="display:inline-flex;gap:4px;align-items:center;color:var(--rd-ok)">' + ic('check', 13) + ' Cuadra</span>' : R.chip('Revisar', 'warn', 'warn')) + '</td></tr>';
        }).join('') : '') + '</tbody>';
    });
    return t + '</table></div></div>';
  }

  function detalle(c, v) {
    var a = S.sel && D.apu(v, S.sel), p = a && D.precio(v, S.depto, a.id);
    if (!a || !p || a.activo === false) return '<div class="rd-card rd-empty"><b>Elige un APU</b>Búscalo arriba o recórrelo en el árbol para ver su precio por unidad en ' + esc(S.depto) + ' y su composición.</div>';
    var g = D.capitulo(a.capId), ctl = D.control(p), u = uso();
    return '<div class="rd-card" id="itemFold"><div class="rd-crumb">' + esc(S.depto) + ' › Capítulo ' + esc(g.cod) + ' · ' + esc(g.nombre) + ' › APU</div>' +
      '<div class="rd-detail-head"><h3 class="rd-apu-title rd-grow">' + esc(a.cod) + ' · ' + esc(a.nombre) + '</h3><div class="rd-row"><button class="naowee-btn naowee-btn--mute naowee-btn--small" id="cqCopiar">Copiar código</button><button class="naowee-btn naowee-btn--mute naowee-btn--small" id="cqCerrar" aria-label="Cerrar el detalle y ver todos los capítulos">' + ic('x', 14) + 'Ver todos los capítulos</button></div></div>' +
      '<div class="rd-row" style="margin-top:8px">' + R.chip('Unidad: ' + a.unidad, 'neutral') + R.chip(v.v + ' vigente', 'ok') + '</div>' +
      '<div style="margin-top:16px"><div class="rd-crumb">Valor del APU en ' + esc(S.depto) + '</div><div class="rd-price" id="cqPrecio"><b>' + D.fmtCOP(p.valor) + '</b><span>por ' + esc(a.unidad) + '</span></div><div class="rd-sub">Valor cargado desde la matriz</div></div>' +
      '<div class="rd-control rd-control--' + (ctl.ok ? 'ok' : 'bad') + '">' + ic(ctl.ok ? 'check' : 'warn') + '<span><b>Control del valor:</b> ' + (ctl.ok ? 'coincide con la suma de sus ' + p.det.length + ' insumos.' : 'no coincide con la suma de sus insumos (' + D.fmtCOP(ctl.suma) + '). Consulta con el administrador antes de usarlo.') + '</span></div>' +
      '<div class="rd-tbl-wrap" style="margin-top:16px"><table class="rd-tbl"><thead><tr><th>Código</th><th>Insumo</th><th>Unidad</th><th class="r">Cantidad por ' + esc(a.unidad) + '</th><th class="r">V. unitario</th><th class="r">V. total</th></tr></thead><tbody>' +
      p.det.map(function (d) { var i = D.insumo(d.ins); return '<tr><td><b>' + esc(d.ins) + '</b></td><td>' + esc(i.nombre) + (u[d.ins] > 1 ? '<div class="rd-sub">Insumo compartido · en ' + u[d.ins] + ' APU</div>' : '') + '</td><td>' + esc(i.unidad) + '</td><td class="r">' + D.fmtNum(d.cantidad) + '</td><td class="r">' + D.fmtCOP(d.valorUnit) + '</td><td class="r">' + D.fmtCOP(D.totalDet(d)) + '</td></tr>'; }).join('') +
      '</tbody><tfoot><tr><td colspan="5">Suma de insumos</td><td class="r">' + D.fmtCOP(ctl.suma) + '</td></tr></tfoot></table></div></div>';
  }

  function buscar(c, v) {
    var q = U.norm(S.q), res = document.getElementById('cqRes'), inp = document.getElementById('itemSearch');
    if (q.length < 2) { res.hidden = true; inp.setAttribute('aria-expanded', 'false'); return; }
    var apus = v.contenido.apus.filter(function (a) { return a.activo !== false && D.precio(v, S.depto, a.id) && U.norm(a.cod + ' ' + a.nombre).indexOf(q) >= 0; }).slice(0, 8);
    var ins = D.listInsumos().filter(function (i) { return U.norm(i.cod + ' ' + i.nombre).indexOf(q) >= 0; }).slice(0, 5);
    var p = v.contenido.precios[S.depto] || {};
    var h = '';
    if (apus.length) h += '<div class="k">APU en ' + esc(S.depto) + '</div>' + apus.map(function (a) { return '<button role="option" data-go="' + a.id + '"><b>' + esc(a.cod) + '</b><span class="rd-grow">' + esc(a.nombre) + '</span><span class="rd-muted">' + D.fmtCOP(p[a.id].valor) + ' /' + esc(a.unidad) + '</span></button>'; }).join('');
    ins.forEach(function (i) {
      var en = Object.keys(p).filter(function (a) { return p[a].det.some(function (d) { return d.ins === i.cod; }); });
      if (!en.length) return;
      h += '<div class="k">Insumo ' + esc(i.cod) + ' · ' + esc(i.nombre) + ' — está en ' + en.length + ' APU</div>' + en.slice(0, 4).map(function (id) { var a = D.apu(v, id); return a ? '<button role="option" data-go="' + id + '"><b>' + esc(a.cod) + '</b><span class="rd-grow">' + esc(a.nombre) + '</span></button>' : ''; }).join('');
    });
    res.innerHTML = h || '<div class="rd-empty" style="padding:14px"><b>Sin resultados</b>Prueba con el código (p. ej. 3.4) o parte del nombre, sin tildes.</div>';
    res.hidden = false; inp.setAttribute('aria-expanded', 'true');
    res.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { R.flip('#catTree', '#cqDetalle', function () { S.sel = b.dataset.go; S.q = ''; render(); }); sync(); document.getElementById('itemFold') && document.getElementById('itemFold').scrollIntoView({ block: 'nearest' }); }; });
  }

  function sync() {
    var u = new URL(location.href);
    ['cat', 'dep', 'apu'].forEach(function (k, i) { var v = [S.cat, S.depto, S.sel][i]; if (v) u.searchParams.set(k, v); else u.searchParams.delete(k); });
    history.replaceState(null, '', u);
  }
  function wire(c, v) {
    var x;
    if ((x = document.getElementById('cqCat'))) x.onchange = function () { S.cat = x.value; S.sel = null; S.depto = null; render(); sync(); };
    document.getElementById('cqDepto').onchange = function () { S.depto = this.value; render(); sync(); };
    var inp = document.getElementById('itemSearch');
    inp.oninput = function () { S.q = inp.value; buscar(c, v); };
    inp.onkeydown = function (e) { if (e.key === 'ArrowDown') { var f = document.querySelector('#cqRes [data-go]'); if (f) { e.preventDefault(); f.focus(); } } if (e.key === 'Escape') { document.getElementById('cqRes').hidden = true; } };
    var enTabla = !!document.querySelector('#catTree[data-modo="tabla"]');
    document.querySelectorAll('[data-cap]').forEach(function (b) {
      b.onclick = function () {
        var id = b.dataset.cap, abierto = b.getAttribute('aria-expanded') === 'true';
        if (enTabla) S.cerrados[id] = abierto;
        else { S.abiertos[id] = !abierto; if (abierto && D.apu(v, S.sel) && D.apu(v, S.sel).capId === id) S.sel = null; }
        render(); sync();
      };
    });
    document.querySelectorAll('[data-apu]').forEach(function (b) {
      b.onclick = function () { R.flip('#catTree', '#cqDetalle', function () { S.sel = b.dataset.apu; render(); }); sync(); };
      b.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); } };
    });
    document.getElementById('btnAbrirTodo').onclick = function () { S.cerrados = {}; v.contenido.capitulos.forEach(function (cp) { S.abiertos[cp.id] = true; }); render(); };
    document.getElementById('btnCerrarTodo').onclick = function () { v.contenido.capitulos.forEach(function (cp) { S.cerrados[cp.id] = true; }); S.abiertos = {}; S.sel = null; render(); sync(); };
    if ((x = document.getElementById('cqCerrar'))) x.onclick = function () { R.flip('#catTree', '#cqDetalle', function () { S.sel = null; render(); }); sync(); };
    if ((x = document.getElementById('cqCopiar'))) x.onclick = function () { var a = D.apu(v, S.sel); try { navigator.clipboard.writeText(a.cod); } catch (e) {} R.toast('Código <b>' + esc(a.cod) + '</b> copiado.'); };
  }
  document.addEventListener('click', function (e) { var r = document.getElementById('cqRes'); if (r && !e.target.closest('.cq-search') && !e.target.closest('#ttCoach')) r.hidden = true; });
  window.CQ = { buscar: function (t) { var i = document.getElementById('itemSearch'); i.value = t; i.dispatchEvent(new Event('input')); }, abrir: function (id) { S.sel = id; render(); sync(); }, render: render };
  render();
})();
</script>
<script src="../shared/tour.js?v=0.7.0"></script>
</body>
</html>
