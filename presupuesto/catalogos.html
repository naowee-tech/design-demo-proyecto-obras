<!doctype html>
<html lang="es" data-theme="territorio">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto de Obras · Presupuesto · Catálogos de precios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../shared/proyecto-ns.js"></script>
<link rel="stylesheet" href="../shared/design-system.css">
<link rel="stylesheet" href="../shared/theme-territorio.css">
<link rel="stylesheet" href="../shared/glass-theme.css">
<link rel="stylesheet" href="../shared/territorio-shell.css?v=0.7.0">
<link rel="stylesheet" href="../shared/theme.css?v=0.7.0">
<link rel="stylesheet" href="../shared/rediseno.css?v=0.7.0">
<style>
  .cat-name{ font-weight:800; color:var(--rd-ink); }
  .cat-cond{ font-size:12px; color:var(--rd-muted); margin-top:2px; }
</style>
</head>
<body data-role="ADMIN">

<div class="t-shell">
  <aside class="t-side" id="tSide"></aside>
  <div class="t-side-overlay" id="sideOverlay"></div>

  <div class="t-main">
    <header class="t-topbar">
      <button class="t-hamburger" id="hamburger" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="t-topbar-left">
        <div class="t-bc"><a href="../index.html" style="color:inherit;text-decoration:none">Proyecto de Obras</a><span class="sep">/</span><span>Presupuesto</span><span class="sep">/</span><b>Catálogos</b></div>
        <h1>Catálogos de precios</h1>
      </div>
      <div class="t-topbar-right">
        <button class="t-userchip" aria-label="Perfil" onclick="togglePanel()"><span class="ava" id="ucAva">JD</span><span id="ucWho">Jesús Díaz<small>Admin Naowee</small></span><svg class="cv" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </header>

    <main class="t-board">
      <div class="t-board-head">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap" id="kpiWrap"></div>
        <div class="t-board-actions">
          <div class="naowee-searchbox naowee-searchbox--small">
            <div class="naowee-searchbox__input-wrap">
              <span class="naowee-searchbox__icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></span>
              <input class="naowee-searchbox__input" id="tblSearch" placeholder="Buscar por nombre o departamento…" aria-label="Buscar catálogo">
            </div>
          </div>
          <div class="naowee-dropdown naowee-dropdown--small" id="fEstado" style="width:150px;flex-shrink:0">
            <button class="naowee-dropdown__trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="naowee-dropdown__value">Todo estado</span><span class="naowee-dropdown__controls"><span class="naowee-dropdown__chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span></span></button>
            <div class="naowee-dropdown__menu" role="listbox">
              <div class="naowee-dropdown__option naowee-dropdown__option--selected" data-value="">Todo estado</div>
              <div class="naowee-dropdown__option" data-value="Activo">Activo</div>
              <div class="naowee-dropdown__option" data-value="Borrador">Borrador</div>
              <div class="naowee-dropdown__option" data-value="Inactivo">Inactivo</div>
            </div>
          </div>
          <div class="naowee-dropdown naowee-dropdown--small" id="fPrep" style="width:190px;flex-shrink:0">
            <button class="naowee-dropdown__trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="naowee-dropdown__value">Toda versión</span><span class="naowee-dropdown__controls"><span class="naowee-dropdown__chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span></span></button>
            <div class="naowee-dropdown__menu" role="listbox">
              <div class="naowee-dropdown__option naowee-dropdown__option--selected" data-value="">Toda versión</div>
              <div class="naowee-dropdown__option" data-value="prep">Con versión en preparación</div>
              <div class="naowee-dropdown__option" data-value="sinprep">Sin cambios pendientes</div>
            </div>
          </div>
          <span class="t-count" id="count"></span>
          <div class="rd-sep"></div>
          <button class="naowee-btn naowee-btn--loud" id="btnCrear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo catálogo</button>
        </div>
      </div>

      <div class="naowee-table-wrap">
        <table class="naowee-table naowee-table--sticky-header" id="catTable">
          <thead><tr>
            <th scope="col">Catálogo</th>
            <th scope="col">Alcance</th>
            <th scope="col">Vigente</th>
            <th scope="col">En preparación</th>
            <th scope="col">Estado</th>
            <th scope="col"><span class="sr-only">Acciones</span></th>
          </tr></thead>
          <tbody id="catBody"></tbody>
        </table>
      </div>
      <div class="rd-empty" id="tblEmpty" hidden><b>Ningún catálogo coincide</b>Prueba con otro nombre, otro departamento u otro estado.</div>
    </main>
  </div>
</div>

<div class="naowee-menu naowee-menu--small t-rowmenu" id="rowMenu" role="menu" aria-label="Acciones del catálogo">
  <div class="naowee-menu__list">
    <button class="naowee-menu__item" role="menuitem" id="rmAbrir" onclick="rowAct('abrir')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11a2 2 0 0 1 2 2v13H6a2 2 0 0 0-2 2V4z"/></svg>Abrir espacio de trabajo</button>
    <button class="naowee-menu__item" role="menuitem" id="rmEdit" onclick="rowAct('editar')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>Editar datos generales</button>
    <button class="naowee-menu__item" role="menuitem" id="rmEstado" onclick="rowAct('estado')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg><span id="rmEstadoT">Desactivar catálogo</span></button>
  </div>
</div>

<script src="../shared/data-catalogo.js?v=0.7.0"></script>
<script src="../shared/ui.js?v=0.7.0"></script>
<script src="../shared/shell.js?v=0.7.0"></script>
<script src="../shared/rd.js?v=0.7.0"></script>
<script src="../shared/cat-form.js?v=0.7.0"></script>
<script>
(function () {
  'use strict';
  var D = window.OBRAS, U = window.OBRAS_UI, R = window.RD, esc = R.esc;
  var menuId = null;
  function abrirModal(cat) { window.CAT_FORM.abrir(cat, function (c, nuevo) { if (nuevo) location.href = R.href('catalogo-detalle.html', { cat: c.id, nuevo: 1 }); else render(); }); }
  document.getElementById('btnCrear').onclick = function () { abrirModal(null); };

  function kpis() {
    var cats = D.listCatalogos(), act = cats.filter(function (c) { return c.estado === 'Activo'; }).length;
    var prep = cats.filter(function (c) { return D.preparacion(c); }).length;
    var deptos = {}; cats.filter(function (c) { return c.estado === 'Activo'; }).forEach(function (c) { var v = D.vigente(c); if (v) D.deptosCargados(v).forEach(function (d) { deptos[d] = 1; }); });
    function k(l, v, i) { return '<div class="t-kpi"><span class="kpi-ic"><svg viewBox="0 0 24 24">' + i + '</svg></span><div><div class="kpi-l">' + l + '</div><div class="kpi-v">' + v + '</div></div></div>'; }
    document.getElementById('kpiWrap').innerHTML =
      k('Catálogos activos', act, '<path d="M4 4h11a2 2 0 0 1 2 2v13H6a2 2 0 0 0-2 2V4z"/>') +
      k('Con versión en preparación', prep, '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>') +
      k('Departamentos con precios vigentes', Object.keys(deptos).length + ' de 33', '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/>');
  }

  function render() {
    var q = U.norm(document.getElementById('tblSearch').value), fe = U.getDD('fEstado'), fp = U.getDD('fPrep');
    var cats = D.listCatalogos().filter(function (c) {
      if (fe && c.estado !== fe) return false;
      var p = D.preparacion(c);
      if (fp === 'prep' && !p) return false;
      if (fp === 'sinprep' && p) return false;
      if (q && U.norm(c.nombre + ' ' + c.alcance.deptos.join(' ') + ' ' + c.alcance.condicion).indexOf(q) < 0) return false;
      return true;
    });
    document.getElementById('count').textContent = cats.length + ' de ' + D.listCatalogos().length;
    document.getElementById('tblEmpty').hidden = cats.length > 0;
    document.getElementById('catBody').innerHTML = cats.map(function (c) {
      var vig = D.vigente(c), p = D.preparacion(c), nCamb = p ? D.cambiosDe(c, p.v).length : 0;
      var cargados = vig ? D.deptosCargados(vig).length : 0;
      return '<tr class="t-row-click" data-cat="' + c.id + '" tabindex="0">' +
        '<td data-label="Catálogo"><div class="cat-name">' + esc(c.nombre) + '</div><div class="cat-cond">' + esc(c.alcance.condicion || 'Sin condición adicional') + ' · vigencia ' + D.fmtFecha(c.vigenciaIni) + ' – ' + D.fmtFecha(c.vigenciaFin) + '</div></td>' +
        '<td data-label="Alcance"><div>' + esc(R.alcanceTxt(c)) + '</div><div class="cat-cond">' + esc(R.rolesTxt(c)) + '</div></td>' +
        '<td data-label="Vigente">' + (vig ? R.chip(vig.v, 'ok') + '<div class="cat-cond">' + cargados + ' de ' + c.alcance.deptos.length + ' con precios · desde ' + D.fmtFecha(vig.activada) + '</div>' : '<span class="rd-muted">Aún ninguna</span>') + '</td>' +
        '<td data-label="En preparación">' + (p ? R.chip(p.v, 'prep') + '<div class="cat-cond">' + nCamb + ' cambio' + (nCamb === 1 ? '' : 's') + ' sin activar</div>' : '<span class="rd-muted">—</span>') + '</td>' +
        '<td data-label="Estado">' + R.chipEstado(c.estado) + '</td>' +
        '<td class="t-actions"><button class="t-kebab" aria-label="Acciones de ' + esc(c.nombre) + '" data-menu="' + c.id + '"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></td></tr>';
    }).join('');
    document.querySelectorAll('#catBody tr[data-cat]').forEach(function (tr) {
      tr.onclick = function (e) { if (e.target.closest('.t-kebab')) return; location.href = R.href('catalogo-detalle.html', { cat: tr.dataset.cat }); };
      tr.onkeydown = function (e) { if (e.key === 'Enter') tr.click(); };
    });
    document.querySelectorAll('#catBody [data-menu]').forEach(function (b) {
      b.onclick = function (e) { e.stopPropagation(); abrirMenu(b); };
    });
    kpis();
  }

  function abrirMenu(btn) {
    var m = document.getElementById('rowMenu'); menuId = btn.dataset.menu;
    var c = D.getCatalogo(menuId);
    document.getElementById('rmEstadoT').textContent = c.estado === 'Inactivo' ? 'Reactivar catálogo' : 'Desactivar catálogo';
    var r = btn.getBoundingClientRect();
    m.style.top = Math.min(r.bottom + 4, window.innerHeight - 160) + 'px'; m.style.left = Math.max(8, r.right - 206) + 'px';
    m.classList.add('open');
  }
  document.addEventListener('click', function (e) { if (!e.target.closest('#rowMenu')) document.getElementById('rowMenu').classList.remove('open'); });

  window.rowAct = function (a) {
    document.getElementById('rowMenu').classList.remove('open');
    var c = D.getCatalogo(menuId); if (!c) return;
    if (a === 'abrir') location.href = R.href('catalogo-detalle.html', { cat: c.id });
    if (a === 'editar') abrirModal(c);
    if (a === 'estado') {
      if (c.estado === 'Inactivo') {
        c.estado = D.vigente(c) ? 'Activo' : 'Borrador'; D.saveCatalogo(c);
        D.logAudit(c, 'Reactivar catálogo', 'Catálogo'); R.toast('<b>' + esc(c.nombre) + '</b> vuelve a estar ' + c.estado.toLowerCase() + '.'); render();
        return;
      }
      var pp = D.presupuestosDe(c.id);
      R.pedirMotivo({ titulo: 'Desactivar catálogo', sub: c.nombre, ok: 'Desactivar',
        extra: '<p class="rd-sub">Deja de aparecer en Consulta y no se pueden crear presupuestos con él. Sus versiones quedan en el historial.' + (pp.length ? ' <b>' + pp.length + ' presupuesto' + (pp.length === 1 ? '' : 's') + '</b> lo usan y siguen con su versión.' : '') + '</p>' }).then(function (m) {
        if (!m) return;
        c.estado = 'Inactivo'; c.motivoInactivo = m; D.saveCatalogo(c);
        D.logAudit(c, 'Desactivar catálogo', 'Catálogo', { detalle: { motivo: m } });
        R.toast('<b>' + esc(c.nombre) + '</b> quedó inactivo.'); render();
      });
    }
  };

  U.initDropdowns(); U.initDatepickers();
  document.getElementById('tblSearch').oninput = render;
  ['fEstado', 'fPrep'].forEach(function (id) { document.getElementById(id).addEventListener('dd:change', render); });
  render();
  if (R.qs('nuevo') === '1') abrirModal(null);
})();
</script>
<script src="../shared/tour.js?v=0.7.0"></script>
</body>
</html>
