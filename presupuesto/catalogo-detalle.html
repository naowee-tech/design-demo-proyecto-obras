<!doctype html>
<html lang="es" data-theme="territorio">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto de Obras · Presupuesto · Espacio de trabajo del catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../shared/proyecto-ns.js"></script>
<link rel="stylesheet" href="../shared/design-system.css">
<link rel="stylesheet" href="../shared/theme-territorio.css">
<link rel="stylesheet" href="../shared/glass-theme.css">
<link rel="stylesheet" href="../shared/territorio-shell.css?v=0.7.0">
<link rel="stylesheet" href="../shared/theme.css?v=0.7.0">
<link rel="stylesheet" href="../shared/rediseno.css?v=0.7.0">
</head>
<body data-role="ADMIN">

<div class="t-shell">
  <aside class="t-side" id="tSide"></aside>
  <div class="t-side-overlay" id="sideOverlay"></div>

  <div class="t-main">
    <header class="t-topbar">
      <button class="t-hamburger" id="hamburger" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="t-topbar-left">
        <div class="t-bc"><a href="../index.html" style="color:inherit;text-decoration:none">Proyecto de Obras</a><span class="sep">/</span><a href="catalogos.html" id="bcCats" style="color:inherit;text-decoration:none">Catálogos</a><span class="sep">/</span><b id="bcCat">Catálogo</b></div>
        <h1>Espacio de trabajo</h1>
      </div>
      <div class="t-topbar-right">
        <button class="t-userchip" aria-label="Perfil" onclick="togglePanel()"><span class="ava" id="ucAva">JD</span><span id="ucWho">Jesús Díaz<small>Admin Naowee</small></span><svg class="cv" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </header>

    <main class="t-board">
      <div class="rd-ws-head" id="wsHead"></div>
      <div id="wsVerbar"></div>

      <div class="t-tabs-wrap">
        <div class="naowee-tabs" id="tabsBar" role="tablist" aria-label="Secciones del catálogo">
          <button class="naowee-tab" role="tab" id="tab-contenido" data-tab="contenido" aria-controls="panel-contenido">Contenido</button>
          <button class="naowee-tab" role="tab" id="tab-alcance" data-tab="alcance" aria-controls="panel-alcance">Alcance y estructura</button>
          <button class="naowee-tab" role="tab" id="tab-versiones" data-tab="versiones" aria-controls="panel-versiones">Versiones</button>
          <button class="naowee-tab" role="tab" id="tab-historial" data-tab="historial" aria-controls="panel-historial">Historial</button>
        </div>
      </div>

      <section class="t-panel" id="panel-contenido" role="tabpanel" aria-labelledby="tab-contenido"></section>
      <section class="t-panel" id="panel-alcance" role="tabpanel" aria-labelledby="tab-alcance"></section>
      <section class="t-panel" id="panel-versiones" role="tabpanel" aria-labelledby="tab-versiones"></section>
      <section class="t-panel" id="panel-historial" role="tabpanel" aria-labelledby="tab-historial"></section>
    </main>
  </div>
</div>

<!-- Drawer lateral compartido: editar APU, crear capítulo/APU, agregar/editar insumo -->
<div class="naowee-modal-overlay rd-drawer-ov" id="wsDrawer">
  <aside class="rd-drawer" role="dialog" aria-modal="true" aria-labelledby="drT">
    <div class="rd-drawer-h">
      <div class="rd-grow"><div class="rd-crumb" id="drCrumb"></div><h2 class="rd-h2" id="drT" style="font-size:18px;margin-top:2px"></h2></div>
      <button class="naowee-modal__dismiss" aria-label="Cerrar" onclick="closeModal('wsDrawer')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="rd-drawer-b" id="drB"></div>
    <div class="rd-drawer-f" id="drF"></div>
  </aside>
</div>

<div class="naowee-menu naowee-menu--small t-rowmenu" id="expMenu" role="menu" aria-label="Formato de exportación">
  <div class="naowee-menu__list">
    <button class="naowee-menu__item" role="menuitem" id="rmExportXls" data-fmt="xls">Excel (.xls)</button>
    <button class="naowee-menu__item" role="menuitem" data-fmt="pdf">PDF</button>
    <button class="naowee-menu__item" role="menuitem" data-fmt="csv">CSV</button>
  </div>
</div>

<script src="../shared/data-catalogo.js?v=0.7.0"></script>
<script src="../shared/ui.js?v=0.7.0"></script>
<script src="../shared/shell.js?v=0.7.0"></script>
<script src="../shared/rd.js?v=0.7.0"></script>
<script src="../shared/cat-form.js?v=0.7.0"></script>
<script src="../shared/matriz.js?v=0.7.0"></script>
<script src="ws.js?v=0.7.0"></script>
<script src="../shared/tour.js?v=0.7.0"></script>
</body>
</html>
